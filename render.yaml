services:
  - type: web
    name: claimflow-ai
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: claimflow-ai-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: SEED_DEMO_DATA
        value: "true"

databases:
  - name: claimflow-ai-db
    plan: basic-256mb
    databaseName: claimflow_ai
    user: claimflow_ai
