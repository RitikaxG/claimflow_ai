<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClaimFlow showcase renderer</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f4f49; color: #153f3a; }
      main { width: min(1120px, 92vw); padding: 34px; border-radius: 28px; background: #fbfaf6; box-shadow: 0 30px 90px rgba(0,0,0,.28); }
      header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
      h1 { margin: 0; font-size: 30px; }
      p { margin: 6px 0 0; color: #667a76; }
      canvas { display: block; width: 100%; aspect-ratio: 16/9; border-radius: 18px; background: #fff; border: 1px solid #dce9e5; }
      footer { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-top: 20px; }
      button { border: 0; border-radius: 14px; padding: 14px 22px; background: #16877d; color: white; font: inherit; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: .5; cursor: wait; }
      progress { width: min(520px, 52vw); height: 14px; accent-color: #16877d; }
      #status { font-weight: 650; color: #0f4f49; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div><h1>ClaimFlow AI · 90-second product story</h1><p>Full-HD narrated showcase renderer</p></div>
        <strong id="format">Preparing assets…</strong>
      </header>
      <canvas id="canvas" width="1920" height="1080"></canvas>
      <footer>
        <div><div id="status">Loading 15 scenes…</div><progress id="progress" max="90" value="0"></progress></div>
        <button id="render" disabled>Render 90-second video</button>
      </footer>
    </main>
    <script>
      const scenes = [
        ["scene-01.png",6],["scene-02.png",5],["scene-03.png",4],["scene-04.png",5],["scene-05.png",6],
        ["scene-06.png",6],["scene-07.png",7],["scene-08.png",7],["scene-09.png",8],["scene-10.png",7],
        ["scene-11.png",7],["scene-12.png",6],["scene-13.png",8],["scene-14.png",5],["scene-15.png",3]
      ];
      const canvas = document.querySelector("#canvas");
      const ctx = canvas.getContext("2d", { alpha: false });
      const button = document.querySelector("#render");
      const status = document.querySelector("#status");
      const progress = document.querySelector("#progress");
      const format = document.querySelector("#format");
      let images = [];
      let narrationBuffer;
      let audioContext;

      function chooseMime() {
        const candidates = [
          ["video/mp4;codecs=avc1.42E01E,mp4a.40.2", "mp4"],
          ["video/webm;codecs=vp9,opus", "webm"],
          ["video/webm;codecs=vp8,opus", "webm"],
          ["video/webm", "webm"]
        ];
        return candidates.find(([mime]) => MediaRecorder.isTypeSupported(mime));
      }

      function drawFrame(elapsed) {
        let remaining = Math.min(elapsed, 89.999);
        let index = 0;
        while (index < scenes.length - 1 && remaining >= scenes[index][1]) {
          remaining -= scenes[index][1];
          index += 1;
        }
        const duration = scenes[index][1];
        const local = remaining / duration;
        const transition = index < scenes.length - 1 ? Math.max(0, (remaining - (duration - 0.8)) / 0.8) : 0;
        const scale = 1 + local * 0.018;
        const w = canvas.width * scale, h = canvas.height * scale;
        ctx.fillStyle = "#fbfaf6";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1 - transition;
        ctx.drawImage(images[index], (canvas.width-w)/2, (canvas.height-h)/2, w, h);
        if (transition > 0) {
          ctx.globalAlpha = transition;
          const nextScale = 1 + transition * 0.004;
          const nw = canvas.width * nextScale, nh = canvas.height * nextScale;
          ctx.drawImage(images[index+1], (canvas.width-nw)/2, (canvas.height-nh)/2, nw, nh);
        }
        ctx.globalAlpha = 1;
      }

      async function loadAssets() {
        const selection = chooseMime();
        if (!selection) throw new Error("This browser has no supported video recorder.");
        format.textContent = selection[1].toUpperCase() + " · 1920×1080";
        images = await Promise.all(scenes.map(([name]) => new Promise((resolve, reject) => {
          const image = new Image(); image.onload = () => resolve(image); image.onerror = reject; image.src = `frames/${name}`;
        })));
        audioContext = new AudioContext();
        const audioBytes = await fetch("narration.aiff").then(response => response.arrayBuffer());
        narrationBuffer = await audioContext.decodeAudioData(audioBytes);
        drawFrame(0);
        status.textContent = "Ready to render";
        button.disabled = false;
      }

      async function upload(blob, extension) {
        status.textContent = "Saving the finished video…";
        const response = await fetch(`/upload?ext=${extension}`, { method: "POST", headers: { "Content-Type": blob.type }, body: blob });
        if (!response.ok) throw new Error(await response.text());
        status.textContent = "Video complete and saved";
        progress.value = 90;
        document.title = "ClaimFlow video complete";
      }

      button.addEventListener("click", async () => {
        button.disabled = true;
        await audioContext.resume();
        const [mimeType, extension] = chooseMime();
        const destination = audioContext.createMediaStreamDestination();
        const source = audioContext.createBufferSource();
        source.buffer = narrationBuffer;
        source.connect(destination);
        const canvasStream = canvas.captureStream(30);
        const stream = new MediaStream([...canvasStream.getVideoTracks(), ...destination.stream.getAudioTracks()]);
        const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 5_500_000, audioBitsPerSecond: 128_000 });
        const chunks = [];
        recorder.ondataavailable = event => { if (event.data.size) chunks.push(event.data); };
        recorder.onstop = async () => {
          const blob = new Blob(chunks, { type: mimeType });
          await upload(blob, extension);
        };
        const start = performance.now();
        recorder.start(1000);
        source.start(0);
        function tick(now) {
          const elapsed = (now - start) / 1000;
          drawFrame(elapsed);
          progress.value = Math.min(90, elapsed);
          status.textContent = `Rendering scene ${Math.min(15, Math.floor(elapsed / 6) + 1)} of 15 · ${Math.min(90, Math.floor(elapsed))}s`;
          if (elapsed < 90) requestAnimationFrame(tick);
          else recorder.stop();
        }
        requestAnimationFrame(tick);
      });

      loadAssets().catch(error => { status.textContent = error.message; console.error(error); });
    </script>
  </body>
</html>
