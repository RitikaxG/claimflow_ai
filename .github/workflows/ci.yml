name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/claimflow_ai?sslmode=disable
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: claimflow_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d claimflow_ai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run db:deploy
      - name: Verify idempotent demo seed and reset
        run: bun run demo:seed && bun run demo:seed && bun run demo:reset && bun run demo:seed
      - run: bun run check-types
      - run: bun run lint
      - run: bun run eval:week6:gateway
      - run: bun run build
